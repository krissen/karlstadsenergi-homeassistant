name: "Validate"

on:
  push:
  pull_request:
  schedule:
    # Odd off-peak time avoids the midnight UTC rush that rate-limits hacs/action.
    - cron: "17 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: prek (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"  # v7.0.0
      - uses: "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1"  # v6.3.0
        with:
          python-version: "3.14"

      - name: Set PREK_HOME
        # Outside the working tree so the gitleaks full-tree sweep below
        # doesn't see the hook environments, and so a future default-path
        # change in prek isn't a silent cache miss.
        run: echo "PREK_HOME=${{ runner.temp }}/prek" >> "$GITHUB_ENV"

      - name: Cache prek hook environments
        uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9"  # v6.1.0
        with:
          path: ${{ env.PREK_HOME }}
          key: prek-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install prek
        run: pip install prek==0.5.2

      - name: prek run --all-files
        run: prek run --all-files --show-diff-on-failure

      - name: gitleaks (full tree)
        # The prek hook's entry is hardcoded to `gitleaks git --staged`,
        # which is a no-op on a clean checkout with nothing staged -- this
        # step does a real scan of the whole tree instead. Binary verified
        # against the release's own published sha256 before running it.
        run: |
          curl -sSfLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --no-banner

  pytest:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"  # v7.0.0
      - uses: "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1"  # v6.3.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: pytest tests/ -v

  hassfest:
    name: hassfest
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"  # v7.0.0
      - uses: "home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c"  # master 2026-03-18

  # hacs/action validates the branch via the GitHub API rather than the local
  # checkout. On feature branches this races against post-merge branch deletion
  # ("branch has been removed") and fails spuriously, so restrict it to schedule
  # runs and pushes to main; ruff/pytest/hassfest still gate PRs.
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"  # v7.0.0
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # main 2026-01-26
        with:
          category: integration
